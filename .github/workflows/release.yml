name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match the Manifest package version, for example manifest@6.18.0)."
        required: true
        type: string
      target:
        description: "Branch or commit to release."
        required: true
        default: main
        type: string
      prerelease:
        description: "Mark this as a prerelease."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate package version and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          expected_tag="manifest@$(node -p "require('./packages/manifest/package.json').version")"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "::error::Tag must equal the version in packages/manifest/package.json ($expected_tag)."
            exit 1
          fi
          args=(gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          "${args[@]}"
